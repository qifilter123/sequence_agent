version: 1
dag_id: model_structure

nodes:

  - id: temporal_embedding
    op: build_temporal_embedding
    inputs:
      fields:
        - x_full
    params:
      source_index: 0
      out_dim: 16 #time_emb_dim

  - id: x_with_time
    op: build_concat
    inputs:
      fields:
        - x_full
        - temporal_embedding
    params:
      dim: -1

  - id: feature_corr_input_dim
    op: add_numbers
    inputs: {} # place holder, no ipput needed
    params:
      left: 15 # input_base_dim
      right: 16 # time_emb_dim

  - id: feature_corr_linear_1
    op: build_linear_transform
    inputs:
      fields:
        - x_with_time
    params:
      output_dim: 32
    derived_params:
      input_dim: feature_corr_input_dim

  - id: feature_corr_activation_1
    op: build_activation
    inputs:
      fields:
        - feature_corr_linear_1
    params:
      activation_name: relu

  - id: feature_corr_dropout
    op: build_dropout
    inputs:
      fields:
        - feature_corr_activation_1
    params:
      dropout_rate: 0.1 # dropout

  - id: feature_corr_linear_2
    op: build_linear_transform
    inputs:
      fields:
        - feature_corr_dropout
    params:
      input_dim: 32
      output_dim: 16 # combo_dim

  - id: sw_combo
    op: build_activation
    inputs:
      fields:
        - feature_corr_linear_2
    params:
      activation_name: relu

  - id: fwd_input
    op: build_concat
    inputs:
      fields:
        - x_full
        - temporal_embedding
        - sw_combo
    params:
      dim: -1

  - id: gru_input_dim_0
    op: add_numbers
    inputs: {} #Place holder, no inputs neded
    params:
      right: 16 # combo_dim
    derived_params:
      left: feature_corr_input_dim

  # Block 0: no residual.
  - id: fwd_gru_0
    op: build_gru
    inputs:
      fields:
        - fwd_input
    params:
      batch_first: true
      hidden_dim: 64 # hidden_dim
    derived_params:
      input_dim: gru_input_dim_0

  - id: fwd_norm_0
    op: build_layer_norm
    inputs:
      fields:
        - fwd_gru_0
    params:
      normalized_shape: 64 # hidden_dim

  - id: fwd_dropout_0
    op: build_dropout
    inputs:
      fields:
        - fwd_norm_0
    params:
      dropout_rate: 0.1 # dropout

  - id: fwd_gru_1
    op: build_gru
    inputs:
      fields:
        - fwd_dropout_0
    params:
      batch_first: true
      input_dim: 64 # hidden_dim
      hidden_dim: 64 # hidden_dim

  - id: fwd_norm_1
    op: build_layer_norm
    inputs:
      fields:
        - fwd_gru_1
    params:
      normalized_shape: 64 # hidden_dim

  - id: fwd_dropout_1
    op: build_dropout
    inputs:
      fields:
        - fwd_norm_1
    params:
      dropout_rate: 0.1 # dropout

  - id: fwd_residual_1
    op: build_residual
    inputs:
      x: fwd_dropout_1
      residual: fwd_dropout_0

  # Terminal build node. root_model adds no computation; it exposes the
  # upstream symbolic graph as one executable nn.Module. With one root input,
  # forward() returns that value directly. External inputs (x_full here) are
  # discovered from the symbolic dependency graph.
  - id: model_wrapper_node
    op: build_root_model
    inputs:
      embeddings: fwd_residual_1

outputs:
  model: model_wrapper_node
