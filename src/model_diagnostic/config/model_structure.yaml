version: 1
dag_id: model_structure

# Source of truth for the trainable encoder topology.
# This is a BUILD DAG: DagProcessor runs it once during model initialization.
# Its root node outputs an executable torch.nn.Module. During training/inference,
# PyTorch calls that module's forward(); DagProcessor is not on the hot path.
#
# Prediction heads and loss are intentionally NOT part of this DAG.
# They are defined separately in prediction_loss.yaml.

nodes:
  # x_full -> t_emb
  - id: temporal_embedding
    op: temporal_embedding
    inputs:
      fields:
        - x_full
    params:
      source_index: 0
    cfg_params:
      out_dim: time_emb_dim

  # (x_full, t_emb) -> x_with_time
  - id: x_with_time
    op: concat
    inputs:
      fields:
        - x_full
        - temporal_embedding
    params:
      dim: -1

  # Build-time dimension: input_base_dim + time_emb_dim.
  - id: feature_corr_input_dim
    op: add
    inputs: {}
    cfg_params:
      left: input_base_dim
      right: time_emb_dim

  - id: feature_corr_linear_1
    op: linear_transform
    inputs:
      fields:
        - x_with_time
    params:
      output_dim: 32
    derived_params:
      input_dim: feature_corr_input_dim

  - id: feature_corr_activation_1
    op: activation
    inputs:
      fields:
        - feature_corr_linear_1
    params:
      activation_name: relu

  - id: feature_corr_dropout
    op: dropout
    inputs:
      fields:
        - feature_corr_activation_1
    cfg_params:
      dropout_rate: dropout

  - id: feature_corr_linear_2
    op: linear_transform
    inputs:
      fields:
        - feature_corr_dropout
    params:
      input_dim: 32
    cfg_params:
      output_dim: combo_dim

  - id: sw_combo
    op: activation
    inputs:
      fields:
        - feature_corr_linear_2
    params:
      activation_name: relu

  # (x_full, t_emb, sw_combo) -> forward sequence stack
  - id: fwd_input
    op: concat
    inputs:
      fields:
        - x_full
        - temporal_embedding
        - sw_combo
    params:
      dim: -1

  # Build-time dimension: feature_corr_input_dim + combo_dim.
  - id: fwd_input_dim
    op: add
    inputs: {}
    cfg_params:
      right: combo_dim
    derived_params:
      left: feature_corr_input_dim

  # Block 0: no residual.
  - id: fwd_gru_0
    op: GRU
    inputs:
      fields:
        - fwd_input
    params:
      batch_first: true
    cfg_params:
      hidden_dim: hidden_dim
    derived_params:
      input_dim: fwd_input_dim

  - id: fwd_norm_0
    op: LayerNorm
    inputs:
      fields:
        - fwd_gru_0
    cfg_params:
      normalized_shape: hidden_dim

  - id: fwd_dropout_0
    op: dropout
    inputs:
      fields:
        - fwd_norm_0
    cfg_params:
      dropout_rate: dropout

  # Block 1: residual is explicit in the DAG.
  - id: fwd_gru_1
    op: GRU
    inputs:
      fields:
        - fwd_dropout_0
    params:
      batch_first: true
    cfg_params:
      input_dim: hidden_dim
      hidden_dim: hidden_dim

  - id: fwd_norm_1
    op: LayerNorm
    inputs:
      fields:
        - fwd_gru_1
    cfg_params:
      normalized_shape: hidden_dim

  - id: fwd_dropout_1
    op: dropout
    inputs:
      fields:
        - fwd_norm_1
    cfg_params:
      dropout_rate: dropout

  - id: fwd_residual_1
    op: residual
    inputs:
      x: fwd_dropout_1
      residual: fwd_dropout_0

  # Terminal build node. root_model adds no computation; it exposes the
  # upstream symbolic graph as one executable nn.Module. With one root input,
  # forward() returns that value directly. External inputs (x_full here) are
  # discovered from the symbolic dependency graph.
  - id: model
    op: root_model
    inputs:
      embeddings: fwd_residual_1

outputs:
  model: model
