# -----------------------------------------------------------------------------
# Overview
# -----------------------------------------------------------------------------
# Purpose: Select sequence fields from an incoming batch and produce the raw
#   tensor mapping consumed by the feature-transform DAG.
# DAG type: RUNTIME DAG; executed for each batch before input transformation.
# Inputs: Raw batch fields supplied by the caller.
# Outputs: Extracted raw fields moved to the configured runtime device.
#
# Framework contract:
#   inputs     = DAG/external data dependencies
#   params     = literal operation semantics
#   cfg_params = attributes resolved from runtime['cfg']
#   runtime    = caller-supplied execution objects and configuration

version: 1
dag_id: input_extractor

nodes:
  - id: extracted_batch
    op: extract_sequence_fields
    inputs:
      fields:
        mask: mask
        dt: dt
        amount: amount
        sw_ip: sw_ip
        sw_email: sw_email
        sw_fp: sw_fp
        sw_bill: sw_bill
        sw_ship: sw_ship
        cum_dist_ip: cum_dist_ip
        cum_dist_email: cum_dist_email
        cum_dist_fp: cum_dist_fp
        cum_dist_bill: cum_dist_bill
        cum_dist_ship: cum_dist_ship
        is_new_ip: is_new_ip
        is_new_email: is_new_email
        is_new_fp: is_new_fp
        is_new_bill: is_new_bill
        is_new_ship: is_new_ship
    cfg_params:
      device: device

outputs:
  raw: extracted_batch
